plugin = /home/xsaddy/.config/hypr/hyprglass.so

plugin {
    hyprglass {
        # Глобальное включение плагина
        enabled = true

        layers {
            enabled = true
	    exclude_namespaces = waybar,debug-panel,hyprshot
        }
        
        # Автоматически отключает стандартное размытие Hyprland для окон с эффектом стекла
        manage_window_blur = true
        
        # Экономит ресурсы GPU, пропуская отрисовку под полностью непрозрачными окнами
        skip_opaque_windows = true
        
        # Базовая тема по умолчанию (dark или light)
        default_theme = dark

        # ─── НАСТРОЙКИ СТЕКЛЯННОЙ ПАНЕЛИ (ЖИДКОЕ СТЕКЛО) ─────────────────
        
        # Сила размытия внутри окна (value * 12.0 пикселей). 
        # Значение 2.0–2.5 дает ощущение толстого, увесистого стекла.
        blur_strength = 1.8
        blur_iterations = 2        # Количество проходов размытия Гаусса (1-5)

        # Преломление света (искажение заднего плана на краях окон). 
        # Ключевой параметр «жидкого» эффекта.
        refraction_strength = 1.25 # 0.85
        refraction_flow = 0.0      # БЫЛО 1.5  0 = искажение тянется к центру окна
        refraction_spread = 0.0    # БЫЛО 0.8 Глубина искажения от края к центру

        # Хроматическая аберрация (RGB-расщепление спектра света на гранях)
        chromatic_aberration = 1.00 # 0.55

        # Эффект Френеля (интенсивность свечения краев под углом)
        fresnel_strength = 0.8 # 1.5
        fresnel_tint = 1.2         # 0 = белый свет, 1 = окрашивание цветами из-за стекла
        fresnel_color = 0xffffff00 # Цвет свечения (HEX RRGGBBAA)

        # Спекулярные блики (имитация отражения источника света на поверхности)
        specular_strength = 1.85   # 0.85
        specular_angle = 330.0     # Угол падения виртуального света (в градусах)

        # Фаска / Скос (тонкая подсвеченная линия на самой границе)
        bevel_strength = 0.1
        bevel_size = 20.0           # Ширина фаски в логических пикселях
        bevel_angle = 315.0        # Угол отражения фаски

        # Общие физические свойства слоя
        glass_opacity = 1       # Общая прозрачность структуры стекла
        edge_thickness = 0.2      # БЫЛО 0.07 Толщина кромки стекла (доля от размера окна)
        lens_distortion = 0.3       # БЫЛО 0.3 Легкое линзовое искажение по центру (эффект купола)

        # Тон стекла (RRGGBBAA: легкий сине-серый оттенок с прозрачностью)
        tint_color = 0x8899aa15

        # ─── ЦВЕТОКОРРЕКЦИЯ ДЛЯ ТЕМНОЙ ТЕМЫ ─────────────────────────────
        dark {
            brightness = 1.00      # БЫЛО 0.8 Небольшое затемнение фона для читаемости текста
            contrast = 1        # Контрастность под стеклом
            saturation = 0.85      # Плавное приглушение избыточной пестроты цветов
            vibrancy = 0.20        # Выборочное усиление сочности для изоляции элементов
        }
    }
}

