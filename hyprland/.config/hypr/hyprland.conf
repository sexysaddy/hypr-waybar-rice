# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.active_border = rgba(33ccffee)
    col.active_border = rgb(800020) rgb(ff3369) rgb(800020) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {

    rounding = 25
    rounding_power = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 1
        passes = 5

        vibrancy = 0.1696
    }
}

exec-once = snappy-switcher --daemon

bind = ALT, Tab, exec, snappy-switcher next


# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  # кривые: отскок, пружина, резкий старт, "втягивание"
     bezier = bounce,   0.34, 1.56, 0.64, 1
     bezier = overshot, 0.05, 0.9, 0.1, 1.1
     bezier = snappy,   0.16, 1, 0.3, 1
     bezier = smooth,   0.25, 0.1, 0.25, 1
     bezier = suck,     0.36, 0, 0.66, -0.56
     bezier = linear,   0, 0, 1, 1

     animation = borderangle, 1, 60, linear, loop

       #ДЛЯ СЛАБОГО ПК ИЛИ НОУЬБУКА

    # animation = borderangle, 0

    # окна вылетают с отскоком, закрываются втягиваясь
     animation = windowsIn,   1, 6, bounce, popin 50%
     animation = windowsOut,  1, 5, suck, popin 60%
     animation = windowsMove, 1, 5, overshot

    # воркспейсы как свайп в тиктоке, по вертикали
     animation = workspaces,       1, 7, snappy, slidefadevert 25%
     animation = specialWorkspace, 1, 6, bounce, slidefadevert 30%

    # лаунчер, уведомления, панели
     animation = layersIn,  1, 5, bounce, popin 80%
     animation = layersOut, 1, 4, suck, popin 80%

    # фейды и рамка
     animation = fadeIn,     1, 5, smooth
     animation = fadeOut,    1, 4, smooth
     animation = fadeSwitch, 1, 4, smooth
     animation = border,     1, 10, smooth

}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
windowrule = match:class ^(gemini-popup)$, float true
windowrule = match:class ^(gemini-popup)$, size 200 200
windowrule = match:class ^(gemini-popup)$, center true

windowrule = match:initial_class ^(yazi-float)$, float true
windowrule = match:initial_class ^(yazi-float)$, size 700 400
windowrule = match:initial_class ^(yazi-float)$, center true

windowrule = match:class ^(vesktop)$, opacity 0.90 0.65
windowrule = tag +hyprglass_theme_dark, match:class ^(vesktop)$

windowrule = opacity 0.75 0.55, match:class ^(YandexMusic)$

windowrule = opacity 0.75 0.55, match:class ^(steam)$

windowrule = opacity 0.85 override 0.55 override, match:class ^(Thunar)$
windowrule = match:class ^(xdg-desktop-portal-gtk)$, opacity 0.85 0.55

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
   # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vrr = 0
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
     gesture = 3, horizontal, workspace
     gesture = 3, up, fullscreen
     gesture = 3, down, fullscreen
     #gesture = 4, pinchout, float
     #gesture = 4, pinchin, exec, wofi -show drun
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


