# HyprCursorFX — native cursor effects
# mode can be a built-in effect or the id of a loaded custom module.
# Built-ins: off, fairy_dust, ghost, trailing, bubbles, snowflakes, rainbow, following_dot, clock
mode=fairy_dust
enabled=true

# Custom effect modules (.so) are discovered in subfolders of this directory.
# Empty means $XDG_CONFIG_HOME/hypr/hyprcursorfx/effects, or ~/.config/... if XDG_CONFIG_HOME is unset.
effects_dir=
# Load all enabled effect modules or list ids separated by commas, e.g. custom_effects=pulse,my_effect.
custom_effects=all

# Global hard cap; each particle effect has its own lower cap.
max_particles=380
particle_size=4
speed=1.0
colors=#D61C59,#E7D84B,#1B8798

# BubbleCursor
bubble_spacing=5
bubble_limit=100
bubble_lifetime_ms=4200
bubble_fill=#E6F1F7
bubble_stroke=#3A92C5

# Fairy Dust
fairy_dust_spacing=2.6
fairy_dust_limit=220

# Snowflakes
snowflake_spacing=3.8
snowflake_limit=320

# GhostCursor
ghost_spacing=5
ghost_limit=18

# RainbowCursor
rainbow_size=3

# FollowingDotCursor
following_dot_color=#323232
following_dot_alpha=0.65

# ClockCursor
clock_radius=45
clock_date_color=#0000FF
clock_face_color=#F2F7FF
clock_outline_color=#B8CCE3
clock_seconds_color=#FF0000
clock_minutes_color=#F2F7FF
clock_hours_color=#F2F7FF

# Backward-compatible legacy keys.
lifetime_ms=1200
spawn_spacing=2
ghost_count=15
trail_lifetime_ms=667
