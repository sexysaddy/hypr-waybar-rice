# HyprCursorFX — native effects based on tholman.com/cursor-effects
# mode: off, fairy_dust, ghost, trailing, bubbles, snowflakes, rainbow, following_dot, clock
mode=fairy_dust
enabled=true

# Global hard cap; each particle effect has its own lower cap.
max_particles=240
particle_size=4
speed=1.0
colors=#D61C59,#E7D84B,#1B8798

# BubbleCursor: smaller, denser bubbles that live longer.
bubble_spacing=5
bubble_limit=100
bubble_lifetime_ms=4200
bubble_fill=#E6F1F7
bubble_stroke=#3A92C5

# Fairy Dust: coloured ASCII stars, sampled along the movement path.
fairy_dust_spacing=2
fairy_dust_limit=140

# Snowflakes: white ASCII flakes falling faster.
snowflake_spacing=3
snowflake_limit=32

# GhostCursor: actual system cursor image size and hotspot.
ghost_spacing=5
ghost_limit=18

# RainbowCursor: six 3px colour bands, ~18px total height.
rainbow_size=3

# FollowingDotCursor is an additional option from the site.
following_dot_color=#323232
following_dot_alpha=0.65

# ClockCursor: size and classic site palette.
clock_radius=45
clock_date_color=#0000FF
clock_face_color=#000000
clock_seconds_color=#FF0000
clock_minutes_color=#000000
clock_hours_color=#000000

# Backward-compatible legacy keys.
lifetime_ms=1200
spawn_spacing=2
ghost_count=15
trail_lifetime_ms=667
